# Constroi e publica o site de documentacao em gh-pages.
#
# O `docs/` fica FORA do repo (ver .gitignore): HTML gerado nao e fonte, e um
# diff de 5 MB a cada mudanca de uma linha de roxygen esconde o que mudou de
# verdade. Quem publica e este workflow.
#
# A primeira execucao cria o branch gh-pages. Depois disso, e preciso apontar
# Settings > Pages para "Deploy from a branch: gh-pages / (root)" uma unica vez.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Só publica a partir do repo original; um fork constroi mas nao publica.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
